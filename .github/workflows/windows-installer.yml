# Builds the Windows (x64) installer of this fork on GitHub-hosted runners.
#
# Signing modes:
#   signed    Sign every executable and the installer with your own code-signing certificate.
#             Needs the repository secrets WINDOWS_SIGNING_PFX_BASE64 and WINDOWS_SIGNING_PFX_PASSWORD
#             (see docs/fork-windows-build.md). Keeps all of the app's security checks on; the
#             certificate must be trusted on the PC you install on.
#   dev-mode  Unsigned build with signature/path checks turned off (build_all --dev-mode). For testing
#             only: any program on the PC could then drive the privileged helper service.
#   auto      signed when the secrets exist, otherwise dev-mode. Pushes always use auto.
#
# The first run builds Qt, OpenSSL, Boost and the rest from source through vcpkg (a few hours).
# The compiled packages are cached, so later runs only rebuild the app.

name: Build Windows installer

on:
  push:
    branches:
      - claude/adoring-fermi-qyxwb9
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      signing:
        description: 'signed (your certificate), dev-mode (unsigned, checks off), or auto'
        type: choice
        options:
          - auto
          - signed
          - dev-mode
        default: auto

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 355
    env:
      VCPKG_ROOT: C:\wsvcpkg
      VCPKG_BINARY_SOURCES: clear;files,C:\vcpkg-bincache,readwrite
      VCPKG_DISABLE_METRICS: '1'
      PYTHONIOENCODING: utf_8
      PYTHONDONTWRITEBYTECODE: '1'
      RUNNING_CI: '1'
      HAS_SIGNING_SECRET: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 != '' }}

    steps:
      - name: Enable long paths for git
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: Choose signing mode
        shell: pwsh
        run: |
          $requested = '${{ github.event.inputs.signing }}'
          if ([string]::IsNullOrEmpty($requested)) { $requested = 'auto' }
          $hasSecret = $env:HAS_SIGNING_SECRET -eq 'true'
          switch ($requested) {
            'signed'   { if (-not $hasSecret) { throw "Signing was requested but the WINDOWS_SIGNING_PFX_BASE64 secret is not set." }; $mode = 'signed' }
            'dev-mode' { $mode = 'dev-mode' }
            default    { $mode = if ($hasSecret) { 'signed' } else { 'dev-mode' } }
          }
          if ($mode -eq 'dev-mode') {
            Write-Output "::warning::Building in dev-mode: unsigned, with the app's signature and path checks turned off. Use for testing only."
          }
          Write-Output "Signing mode: $mode"
          "WS_BUILD_MODE=$mode" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python build dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Install vcpkg (Windscribe registry, pinned to this version's baseline)
        shell: pwsh
        run: |
          $config = Get-Content tools/vcpkg/vcpkg-configuration.json -Raw | ConvertFrom-Json
          $baseline = ($config.registries | Where-Object { $_.repository -like '*ws-vcpkg-registry*' }).baseline
          if (-not $baseline) { throw "Could not read the ws-vcpkg-registry baseline." }
          $registry = Join-Path $env:RUNNER_TEMP 'ws-vcpkg-registry'
          git init -q $registry
          git -C $registry fetch -q --depth 1 https://github.com/Windscribe/ws-vcpkg-registry.git $baseline
          git -C $registry checkout -q FETCH_HEAD
          New-Item -ItemType Directory -Force -Path C:\vcpkg-bincache | Out-Null
          cmd /c "`"$registry\install-vcpkg\vcpkg_install.bat`" $env:VCPKG_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg installation failed" }
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) { throw "vcpkg.exe missing after installation" }

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg-bincache
          key: vcpkg-bin-win-x64-${{ hashFiles('tools/vcpkg/vcpkg.json', 'tools/vcpkg/vcpkg-configuration.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bin-win-x64-${{ hashFiles('tools/vcpkg/vcpkg.json', 'tools/vcpkg/vcpkg-configuration.json') }}-
            vcpkg-bin-win-x64-

      - name: Download and build bundled dependencies (OpenVPN DCO, Wintun, WSTunnel)
        run: |
          python tools/deps/install_openvpn_dco.py
          if ($LASTEXITCODE -ne 0) { throw "install_openvpn_dco failed" }
          python tools/deps/install_wintun.py
          if ($LASTEXITCODE -ne 0) { throw "install_wintun failed" }
          python tools/deps/install_wstunnel.py
          if ($LASTEXITCODE -ne 0) { throw "install_wstunnel failed" }

      - name: Prepare signing certificate
        if: env.WS_BUILD_MODE == 'signed'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ($env:PFX_PASSWORD -notmatch '^[A-Za-z0-9]+$') {
            throw "WINDOWS_SIGNING_PFX_PASSWORD must contain only letters and digits (it is passed through cmd.exe)."
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:PFX_PASSWORD)
          $subject = $cert.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if (-not $cert.HasPrivateKey) { throw "The .pfx has no private key." }
          Write-Output "Signing certificate: CN=$subject, thumbprint $($cert.Thumbprint), valid until $($cert.NotAfter)"
          "WS_SIGNING_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WS_SIGNING_CERT_SUBJECT=$subject" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build app and installer
        timeout-minutes: 300
        env:
          WS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ($env:WS_BUILD_MODE -eq 'signed') {
            python tools/build_all.py --build-app --sign-app --build-installer --sign-installer
          } else {
            python tools/build_all.py --build-app --build-installer --dev-mode
          }
          if ($LASTEXITCODE -ne 0) { throw "build_all failed" }

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg-bincache
          key: vcpkg-bin-win-x64-${{ hashFiles('tools/vcpkg/vcpkg.json', 'tools/vcpkg/vcpkg-configuration.json') }}-${{ github.run_id }}

      - name: Check signatures
        if: env.WS_BUILD_MODE == 'signed'
        shell: pwsh
        run: |
          # build_all hides signtool's output, so confirm every shipped binary carries our signature.
          $files = @(Get-ChildItem -Path build/temp/InstallerFiles -File | Where-Object { $_.Extension -in '.exe', '.dll' })
          $files += Get-Item build/src/installer/gui/windows/installer/installer.exe
          $bad = @()
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if (-not $sig.SignerCertificate -or $sig.SignerCertificate.GetNameInfo('SimpleName', $false) -ne $env:WS_SIGNING_CERT_SUBJECT) {
              $bad += $f.Name
            }
          }
          if ($bad.Count -gt 0) { throw "Not signed with CN=$($env:WS_SIGNING_CERT_SUBJECT): $($bad -join ', ')" }
          Write-Output "All $($files.Count) binaries are signed by CN=$($env:WS_SIGNING_CERT_SUBJECT)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windscribe-proxy-fork-${{ env.WS_BUILD_MODE }}-${{ github.sha }}
          path: build/src/installer/gui/windows/installer/installer.exe
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          if (Test-Path $pfx) { Remove-Item -Force $pfx }
